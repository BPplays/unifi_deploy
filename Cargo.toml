[package]
name = "unifi_deploy"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4.0", features = ["derive"] }
ssh2 = "0.9.6"
crossbeam-channel = "0.5"
sha3 = "0.12.0"
anyhow = "1.0.104"
hex = "0.4.3"
russh = { version = "0.63.3", default-features = false, features = [
    "flate2",
    "ring",
    "rsa",
] }
russh-sftp = "3.0.0"
tokio = { version = "1.53.1", features = ["full"] }

